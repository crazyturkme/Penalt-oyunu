<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Penaltı Kralı</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
.game{width:min(100%,520px);padding:18px 14px 28px;text-align:center}
h1{margin:4px 0 6px;font-size:30px}.sub{opacity:.7;margin-bottom:12px}
.score{display:flex;justify-content:space-between;background:#151d34;border-radius:14px;padding:12px 16px;margin-bottom:12px;font-weight:700}
.pitch{position:relative;height:330px;border-radius:20px;overflow:hidden;background:linear-gradient(#168447 0 58%,#126d3a 58%);border:3px solid #fff}
.pitch:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 49px,rgba(255,255,255,.035) 49px 98px)}
.goal{position:absolute;top:28px;left:8%;width:84%;height:145px;border:6px solid #fff;border-bottom:10px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.net{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.16) 19px 20px),repeating-linear-gradient(0deg,transparent 0 18px,rgba(255,255,255,.16) 19px 20px)}
.keeper{position:absolute;top:105px;left:50%;transform:translateX(-50%);font-size:58px;transition:.35s ease;z-index:3}
.ball{position:absolute;bottom:27px;left:50%;transform:translateX(-50%);font-size:42px;z-index:4;transition:.45s cubic-bezier(.2,.8,.2,1)}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
button{border:0;border-radius:14px;padding:15px 8px;font-size:16px;font-weight:800;background:#fff;color:#10172a;touch-action:manipulation}
button:active{transform:scale(.96)}.restart{margin-top:10px;width:100%;background:#2d3858;color:white}
.msg{height:34px;margin-top:10px;font-size:21px;font-weight:900}
.small{font-size:13px;opacity:.65;margin-top:8px}
</style>
</head>
<body>
<div class="game">
<h1>⚽ Penaltı Kralı</h1><div class="sub">Kaleciyi şaşırt, 5 penaltıda en yüksek skoru yap!</div>
<div class="score"><span>Gol: <b id="goals">0</b></span><span>Atış: <b id="shots">0</b>/5</span><span>Skor: <b id="points">0</b></span></div>
<div class="pitch">
  <div class="goal"><div class="net"></div></div>
  <div class="keeper" id="keeper">🧤</div>
  <div class="ball" id="ball">⚽</div>
</div>
<div class="msg" id="msg">Köşeyi seç!</div>
<div class="controls">
<button onclick="shoot('left')">↖ Sol</button>
<button onclick="shoot('center')">⬆ Orta</button>
<button onclick="shoot('right')">↗ Sağ</button>
</div>
<button class="restart" onclick="restart()">🔄 Yeniden Oyna</button>
<div class="small">İpucu: Aynı köşeyi arka arkaya seçmek riskli olabilir 😉</div>
</div>
<script>
let goals=0,shots=0,points=0,locked=false;
const keeper=document.getElementById('keeper'),ball=document.getElementById('ball');
const msg=document.getElementById('msg');
function shoot(dir){
 if(locked||shots>=5)return;
 locked=true; shots++;
 const dirs=['left','center','right'];
 const save=dirs[Math.floor(Math.random()*3)];
 const map={left:'-105px',center:'0px',right:'105px'};
 const ballMap={left:'-150px',center:'0px',right:'150px'};
 keeper.style.transform=`translateX(calc(-50% + ${map[save]}))`;
 ball.style.transform=`translateX(calc(-50% + ${ballMap[dir]})) translateY(-170px) scale(.55)`;
 setTimeout(()=>{
   if(dir!==save){goals++;points+=Math.random()<.35?2:1;msg.textContent='GOOOL! 🔥'}
   else msg.textContent='KURTARDI! 🧤';
   update();
   setTimeout(()=>{
     ball.style.transform='translateX(-50%)';
     keeper.style.transform='translateX(-50%)';
     locked=false;
     if(shots===5) msg.textContent=`Bitti! ${goals}/5 gol — ${points} puan 🏆`;
   },650);
 },450);
}
function update(){goalsEl.textContent=goals;shotsEl.textContent=shots;pointsEl.textContent=points}
const goalsEl=document.getElementById('goals'),shotsEl=document.getElementById('shots'),pointsEl=document.getElementById('points');
window.shoot=shoot;
window.restart=restart;
function restart(){goals=shots=points=0;locked=false;msg.textContent='Köşeyi seç!';ball.style.transform='translateX(-50%)';keeper.style.transform='translateX(-50%)';update()}
</script>
</body>
</html>
